version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        # Set memory limit for 3D files 
        limits:
          memory: 512M

  backend:
    build: ./backend
    container_name: python_api
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:secure_password@db:5432/inventory_db
      JWT_SECRET: your_jwt_secret_key
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    deploy:
      resources:
        limits:
          # Set memory limit for 3D files
          memory: 384M

  frontend:
    build: ./frontend
    container_name: react_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          # Set memory limit for 3D files
          memory: 128M

volumes:
  postgres_data: